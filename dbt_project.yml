name: olist_ecommerce
version: "1.0.0"
config-version: 2
profile: olist_ecommerce

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Olist's data stops in Oct 2018; "today" for recency metrics is the last purchase date.
  as_of_date: "2018-10-17"
  # An order counts as late when it arrives after the date promised at checkout.
  late_grace_days: 0
  # Months with a full, representative order volume (used to flag trend charts).
  first_complete_month: "2017-01-01"
  last_complete_month: "2018-08-01"

models:
  olist_ecommerce:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      analytics:
        +schema: analytics
