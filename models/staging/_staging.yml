version: 2

models:
  - name: stg_olist__orders
    description: One row per order. Renamed and typed; no rows removed.
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_olist__customers')
                field: customer_id
      - name: order_status
        data_tests:
          - accepted_values:
              arguments:
                values: [delivered, shipped, canceled, unavailable, invoiced, processing, created, approved]
      - name: purchased_at
        data_tests: [not_null]

  - name: stg_olist__order_items
    description: One row per item line in an order.
    columns:
      - name: order_item_id
        description: Surrogate key `order_id-line_number`.
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__orders')
                field: order_id
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_olist__sellers')
                field: seller_id
      - name: item_price
        data_tests: [not_null, positive_value]
      - name: freight_value
        data_tests:
          - not_null
          - positive_value:
              arguments:
                allow_zero: true

  - name: stg_olist__payments
    description: One row per payment method used on an order.
    columns:
      - name: payment_id
        data_tests: [unique, not_null]
      - name: payment_type
        data_tests:
          - accepted_values:
              arguments:
                values: [credit_card, boleto, voucher, debit_card, unknown]
      - name: payment_value
        data_tests:
          - positive_value:
              arguments:
                allow_zero: true

  - name: stg_olist__reviews
    description: >
      One row per order (deduplicated: the raw table has 547 orders with more than one
      review; we keep the most recently answered one).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: review_score
        data_tests:
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5]
                quote: false

  - name: stg_olist__customers
    description: One row per order-level customer record (customer_id). See customer_unique_id for the person.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: customer_unique_id
        data_tests: [not_null]
      - name: state
        description: Two-letter Brazilian state code.

  - name: stg_olist__sellers
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: stg_olist__products
    description: One row per product with an English category (fills the 2 categories missing from Olist's translation table).
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: category
        data_tests: [not_null]

  - name: stg_olist__zip_locations
    description: One centroid per zip code prefix, from ~1M raw GPS points (points outside Brazil removed).
    columns:
      - name: zip_code_prefix
        data_tests: [unique, not_null]
